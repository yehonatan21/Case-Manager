# CI/CD
#   Every push / PR: type check, tests (PGlite + PostgreSQL 16), production build, browser walkthrough,
#   Docker image build; on pushes to main the image goes to GitHub Container Registry (ghcr.io/<owner>/<repo>).
#   Vercel deploys through its own Git integration: a preview for every branch (with the Preview, i.e. dev,
#   settings), production for main.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: 22
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Type check, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Tests (in-memory PGlite)
        run: npm test
      - name: Tests (PostgreSQL 16)
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/cm_test
      - run: npm run build

  e2e:
    name: Browser walkthrough
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Playwright + Chromium
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start the production server (demo mode, embedded database)
        run: |
          npm start > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/health && break; sleep 2; done
        env:
          APP_SECRET: ci-only-secret-0123456789abcdef0123456789
          DEMO_MODE: "true"
          PGLITE_DIR: .data/ci
          # e2e/grow.cjs runs a stand-in for Grow's API here.
          GROW_API_URL: http://localhost:4010
          # e2e/push.cjs runs a stand-in push service here.
          PUSH_EXTRA_HOSTS: localhost:4012
          # e2e/whatsapp.cjs runs a stand-in for Meta's WhatsApp API here.
          WHATSAPP_API_URL: http://localhost:4014
          # e2e/invoices.cjs runs a stand-in for Green Invoice's API here.
          INVOICE_API_URL: http://localhost:4016/api/v1
          # e2e/email-calendar.cjs runs a stand-in for Resend's API here.
          RESEND_API_URL: http://localhost:4018
          # Many test scripts sign in to the same demo accounts on one server.
          OTP_MAX_PER_EMAIL: "50"
          OTP_MAX_PER_IP: "500"
          OTP_VERIFY_MAX_PER_IP: "500"
      - name: HTTP API tests (auth, permissions, CSRF, headers)
        run: npm run test:api
        env:
          API_BASE: http://localhost:3000
      - name: Browser flows (journey, accounts; Hebrew & English, desktop & mobile)
        run: npm run e2e
        env:
          BASE: http://localhost:3000
      - name: Upload screenshots and server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: |
            e2e/screenshots/
            server.log
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [check]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
